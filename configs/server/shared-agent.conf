<!-- Shared config for agent group "default" - homelab FIM (added 2026-11-25) -->

<!-- All Linux agents (proxmox, pihole). OPNsense (FreeBSD) is not affected. -->
<agent_config os="Linux">
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/root/.ssh</directories>
    <directories realtime="yes" check_all="yes" restrict="authorized_keys">/home</directories>
    <!-- never copy private key contents into alerts -->
    <nodiff type="sregex">_key$|/id_rsa$|/id_ecdsa$|/id_ed25519$|/id_dsa$|/id_ecdsa_sk$|/id_ed25519_sk$</nodiff>
  </syscheck>
</agent_config>

<!-- Pi-hole only: DNS configuration -->
<agent_config name="pihole">
  <syscheck>
    <directories realtime="yes" check_all="yes" restrict="pihole.toml">/etc/pihole</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/unbound</directories>
  </syscheck>
</agent_config>

<!-- Proxmox only: cluster config (FUSE filesystem, so scheduled scan, not real-time) -->
<agent_config name="proxmox">
  <syscheck>
    <directories check_all="yes">/etc/pve</directories>
    <ignore type="sregex">^/etc/pve/.|^/etc/pve/priv/|/lrm_status$</ignore>
  </syscheck>
</agent_config>
